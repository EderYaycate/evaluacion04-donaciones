spring:
  application:
    name: donante-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # En la nube cada servicio se anuncia con su nombre interno de red.
    hostname: ${SERVICE_HOSTNAME:localhost}
    non-secure-port: ${PORT:8081}
    prefer-ip-address: ${PREFER_IP:false}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/bd_donante_dev?createDatabaseIfNotExist=true&serverTimezone=America/Lima
    username: root
    password:

server:
  port: 8081

app:
  ambiente: desarrollo

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # DB_URL completa la da la plataforma (Railway: MYSQL_URL adaptada a JDBC).
    url: ${DB_URL:jdbc:mysql://localhost:3306/bd_donante_prod?serverTimezone=America/Lima}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:9081}

app:
  ambiente: produccion
