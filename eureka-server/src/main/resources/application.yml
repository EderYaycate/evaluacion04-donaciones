server:
  # En local 8761; en la nube la plataforma inyecta PORT.
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
